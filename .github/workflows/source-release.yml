name: Source release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  source-release:
    name: attest-source
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build reproducible source archive
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          declared_version="$(
            awk -F'"' '/CFBundleShortVersionString:/ { print $2 }' project.yml |
              sort -u
          )"
          if [[ "$declared_version" != "$version" ]]; then
            echo "Tag $RELEASE_TAG does not match project version $declared_version" >&2
            exit 1
          fi

          artifact="ios-local-llm-${version}-source.tar.gz"
          git archive \
            --format=tar \
            --prefix="ios-local-llm-${version}/" \
            HEAD |
            gzip --best --no-name > "$artifact"
          shasum -a 256 "$artifact" > "$artifact.sha256"

          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "checksum=$artifact.sha256" >> "$GITHUB_OUTPUT"

      - name: Attest source archive provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.package.outputs.artifact }}

      - name: Publish GitHub release
        shell: bash
        env:
          ARTIFACT: ${{ steps.package.outputs.artifact }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$ARTIFACT" \
            "$CHECKSUM" \
            --fail-on-no-commits \
            --generate-notes \
            --notes "Source-only release. No signed app binary or model weights are included. Verify the attached archive with Docs/RELEASE_VERIFICATION.md." \
            --title "iOS Local LLM $RELEASE_TAG" \
            --verify-tag
